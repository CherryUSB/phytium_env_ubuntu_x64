transport select jtag
reset_config trst_and_srst
jtag_ntrst_delay 500

# increase working area to 16KB
set WORKAREASIZE 0x40000

if { [info exists CHIPNAME] } {
  set _CHIPNAME $CHIPNAME
} else {
  set _CHIPNAME e2000
}

if { [info exists DAP_TAPID] } {
   set _DAP_TAPID $DAP_TAPID
} else {
   set _DAP_TAPID 0x5ba00477
}

set _DAPNAME $_CHIPNAME.dap
set _CORE_NUM 1
set DBGBASE {0x81c10000}
set CTIBASE {0x81c20000}
set PMUBASE {0x81c30000}
set ETMBASE {0x81c40000}

jtag newtap $_CHIPNAME tap -irlen 4 -expected-id $_DAP_TAPID

dap create $_DAPNAME -ignore-syspwrupack -chain-position $_CHIPNAME.tap

for {set _core 0} {$_core < $_CORE_NUM} {incr _core} {
    set _TARGETNAME   ${_CHIPNAME}.cpu${_core}
    set _CTINAME      ${_CHIPNAME}.cti${_core}
    set _PMUNAME      ${_CHIPNAME}.pmu${_core}
  
    cti create $_CTINAME -dap $_DAPNAME -ap-num 0 \
                -baseaddr [lindex $CTIBASE $_core]

    target create $_TARGETNAME aarch64 -dap $_DAPNAME \
                   -dbgbase [lindex $DBGBASE $_core] \
                   -cti ${_CHIPNAME}.cti${_core} \
                   -coreid $_core

    #cortex_a57_pmu create $_PMUNAME -dap $_DAPNAME -ap-num 0 \
    #            -baseaddr [lindex $PMUBASE $_core]


    $_TARGETNAME configure -rtos hwthread
    $_TARGETNAME configure -event reset-assert-post "aarch64 dbginit"
    $_TARGETNAME configure -event gdb-attach { halt }

    append _smp_command " " $_TARGETNAME
}

if {$_core > 1} {
    eval $_smp_command
}

targets $_TARGETNAME

flash bank qspi0 phytium_qspi 0x28008000 0 0 0 $_TARGETNAME

proc save_uboot_image { fname } {
  # save uboot image as 4Mb binary files
  flash read_bank 0 $fname 0x0 0x20000
}

proc reboot_e2000_core {} {
  # set watchdog to reboot core
  $_TARGETNAME mww 0x28041008 0x1
  $_TARGETNAME mww 0x28041000 0x1
}